name: Generate V8 Female Neural Audio

on:
  push:
    branches: [main]
    paths:
      - generator_v8_audio.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pydub
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate female neural MP3 files
        run: python generator_v8_audio.py
      - name: Validate MP3 files
        run: |
          test "$(find assets/v8/audio -maxdepth 1 -name '*.mp3' | wc -l)" -eq 23
          for f in assets/v8/audio/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" | awk -v file="$f" '{ if ($1 < 0.8) { print "Audio too short: " file; exit 1 } }'
          done
          echo "Validated 23 MP3 files."
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v8/audio
          git commit -m "Generar audio femenino neural V8" || exit 0
          git push
